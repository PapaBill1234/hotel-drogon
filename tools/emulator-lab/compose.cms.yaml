# Optional CMS bridge for the disposable PolarIS/Octane lab. Use the same
# isolated project as compose.yaml so Drogon sees only this lab's database.
services:
  backend:
    build:
      context: ../..
      dockerfile: Dockerfile
    environment:
      APP_ENV: development
      APP_PORT: 8080
      LOG_LEVEL: debug
      LOG_JSON: "false"
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: polaris_lab
      DB_USERNAME: polaris_lab
      DB_PASSWORD: lab_password_only
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      OCTANE_CLIENT_URL: http://127.0.0.1:3201/
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      lab:
        aliases: [app]

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks: [lab]

  frontend-build:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    volumes:
      - frontend_dist:/out

  proxy:
    image: nginx:alpine
    ports:
      - "127.0.0.1:3204:80"
    volumes:
      - ../../proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../proxy:/etc/nginx/config:ro
      - ../../../legacy/phpretro-pdo/web-gallery:/var/www/web-gallery:ro
      - ../../../legacy/phpretro-pdo/housekeeping/images:/var/www/housekeeping-images:ro
      - frontend_dist:/usr/share/nginx/html:ro
    depends_on:
      backend:
        condition: service_started
      frontend-build:
        condition: service_completed_successfully
    networks: [lab]

volumes:
  redis_data:
  frontend_dist:
