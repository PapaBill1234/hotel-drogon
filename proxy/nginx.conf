events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Docker's embedded DNS. Required because proxy_pass below uses a variable
    # ($target_backend), which makes nginx resolve the upstream at request time
    # instead of caching the IP at startup. Without this, recreating the backend
    # container leaves nginx pointing at a stale address and every request 502s.
    resolver 127.0.0.11 valid=10s ipv6=off;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Upstream definition for new Drogon C++ backend
    upstream drogon_backend {
        server backend:8080;
        keepalive 32;
    }

    # Cutover routing map: determine upstream target based on request URI
    map $uri $target_backend {
        default drogon_backend;

        # Infrastructure & APIs
        ~^/health drogon_backend;
        ~^/api/health drogon_backend;
        ~^/metrics drogon_backend;
        ~^/api/ drogon_backend;
    }

    server {
        listen 80;
        server_name localhost;

        # Legacy web-gallery static assets
        location /web-gallery/ {
            alias /var/www/web-gallery/;
            expires 30d;
            add_header Cache-Control "public, no-transform";
            access_log off;
        }

        # WebSocket support for Drogon realtime events
        location /ws {
            proxy_pass http://drogon_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Dynamic routing
        location / {
            proxy_pass http://$target_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
