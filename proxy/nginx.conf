events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Docker's embedded DNS server.
    #
    # Every proxy_pass below uses a *variable*. nginx resolves a variable target
    # by first searching declared server groups (upstream blocks) and only then
    # falling back to a resolver. That matters here: if the target name matches
    # an upstream block, nginx uses the address resolved at startup and caches it
    # forever, so recreating the backend container yields permanent 502s.
    #
    # There is deliberately NO `upstream` block in this file. Map values are
    # literal host:port strings that cannot match a server group, which forces
    # every request through this resolver (re-resolving at most every 10s).
    resolver 127.0.0.11 valid=10s ipv6=off;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Cutover routing map: backend-owned URI prefixes.
    # Values must stay as host:port (see resolver note above).
    map $uri $target_backend {
        default backend:8080;

        ~^/health backend:8080;
        ~^/api/health backend:8080;
        ~^/metrics backend:8080;
        ~^/api/ backend:8080;
    }

    # Shared proxy settings for backend-owned routes.
    proxy_http_version 1.1;

    server {
        listen 80;
        server_name localhost;

        # React SPA build (mounted from frontend/dist).
        root /usr/share/nginx/html;
        index index.html;

        # Legacy web-gallery static assets, served without copying or hashing.
        location /web-gallery/ {
            alias /var/www/web-gallery/;
            expires 30d;
            add_header Cache-Control "public, no-transform";
            access_log off;
        }

        # RSS keeps its legacy path for existing feed readers. EXACT match, so
        # the SPA router does not swallow it while owning /articles.
        location = /articles/rss.xml {
            proxy_pass http://$target_backend;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # JSON API
        location /api/ {
            proxy_pass http://$target_backend;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Infrastructure endpoints
        location = /health {
            proxy_pass http://$target_backend;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }

        location = /metrics {
            proxy_pass http://$target_backend;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }

        # WebSocket support for Drogon realtime events.
        # Also variable-based so it survives a backend container recreate.
        location /ws {
            set $ws_backend backend:8080;
            proxy_pass http://$ws_backend;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Everything else is a client-side route: serve the SPA shell and let
        # React Router resolve it. Static assets are served directly when the
        # file exists.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
