name: CI Build & Verify

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  cpp-build-and-test:
    name: C++ Drogon (Sanitizers + Tests)
    runs-on: ubuntu-24.04

    env:
      # Single source of truth for this job's pinned build dependencies. The
      # install step and the failure-diagnosis step both read this one value, so
      # they cannot disagree with each other; scripts/check_dependency_pins.py
      # compares it with the Dockerfile's builder stage. `git`, `curl` and
      # `ca-certificates` are deliberately absent: the runner image already
      # provides them, and installing them pinned would add a failure mode
      # without changing what is built. `python3` has no version because it runs
      # the linters rather than being linked against.
      #
      # Pins and the update procedure: docs/dependency-policy.md.
      PINS: >-
        build-essential=12.10ubuntu1 cmake=3.28.3-1build7
        ninja-build=1.11.1-2 pkg-config=1.8.1-2build1
        libssl-dev=3.0.13-0ubuntu3.15 zlib1g-dev=1:1.3.dfsg-3.1ubuntu2.2
        libbrotli-dev=1.1.0-2build2 libc-ares-dev=1.27.0-1.0ubuntu1
        libyaml-cpp-dev=0.8.0+dfsg-6build1 libjsoncpp-dev=1.9.5-6build1
        uuid-dev=2.39.3-9ubuntu6.6 libmariadb-dev=1:10.11.14-0ubuntu0.24.04.1
        libpq-dev=16.15-0ubuntu0.24.04.1 libsqlite3-dev=3.45.1-1ubuntu2.8
        libhiredis-dev=1.2.0-6ubuntu3 libspdlog-dev=1:1.12.0+ds-2build1
        libcrypt-dev=1:4.4.36-4build1 catch2=3.4.0-1build1
        libdrogon-dev=1.8.7+ds-1.1build1 nlohmann-json3-dev=3.11.3-1 python3

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          # The runner image adds third-party apt sources — apt.postgresql.org
          # among them — whose versions outrank Ubuntu's. Run 35537686018 failed
          # exactly there: `libpq-dev : Depends: libpq5 (= 16.15-0ubuntu0.24.04.1)
          # but 18.6-1.pgdg24.04+2 is to be installed`, exit 100, "held broken
          # packages". Preferring `release o=Ubuntu` at priority 1001 makes the
          # Ubuntu archive authoritative, which is what "pinned Ubuntu 24.04
          # archive packages" means; 1001 is also the threshold that permits a
          # downgrade, and `--allow-downgrades` lets apt take it rather than
          # refuse. Neither widens what is installed: every package is still
          # named at an exact version, and check_dependency_pins.py still fails on
          # any pin the archive no longer offers. Both were reproduced and fixed
          # in a clean ubuntu:24.04 with the PGDG repository added, which fails
          # with the same message and installs all 21 pins with these two changes.
          printf 'Package: *\nPin: release o=Ubuntu\nPin-Priority: 1001\n' | sudo tee /etc/apt/preferences.d/00-ubuntu-archive-only >/dev/null
          # A failing `apt-get update` from a repository unrelated to this build
          # (the runner image carries several third-party lists) previously
          # aborted this step with a bare exit 100 that said nothing about which
          # repository was at fault, or whether any pin was. Record it instead and
          # let the pinned install below decide: it either succeeds against the
          # index that actually exists, or it fails and the next step reports why.
          sudo apt-get update > /tmp/apt-update.log 2>&1 || echo "::warning title=apt-get update reported failures::$(grep -aE '^(E:|Err:|W: Failed)' /tmp/apt-update.log | head -5 | tr '\n' '|')"
          sudo apt-get install -y --no-install-recommends --allow-downgrades $PINS

      # Self-diagnosing, because a pinned install can fail for two reasons that
      # look identical from outside — exit 100 and no message: a pin has left the
      # archive (Ubuntu LTS archives drop superseded versions), or the index this
      # runner sees is not the one the pins were read from. Report the apt error
      # itself, the sources actually in use, and every pin whose candidate
      # disagrees. `::error` becomes a check-run annotation, so the failure can be
      # read without the job log.
      - name: Diagnose a failed pinned install
        if: failure()
        run: |
          printf 'Package: *\nPin: release o=Ubuntu\nPin-Priority: 1001\n' | sudo tee /etc/apt/preferences.d/00-ubuntu-archive-only >/dev/null
          sudo apt-get install -y --no-install-recommends --allow-downgrades $PINS > /tmp/apt-install.log 2>&1 || true
          echo "::error title=apt install error::$(grep -aE '^E:' /tmp/apt-install.log | head -4 | tr '\n' '|')"
          echo "--- apt sources in use ---"
          grep -ahE '^(deb |URIs:|Suites:)' /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null | head -12
          echo "--- candidates the index offers ---"
          apt-cache policy $(echo $PINS | tr ' ' '\n' | cut -d= -f1) 2>/dev/null | grep -aE '^[a-z0-9]|Candidate:' | head -60
          echo "--- pins that disagree with this index ---"
          for pin in $PINS; do
            name=${pin%%=*}
            want=${pin#*=}
            [ "$name" = "$pin" ] && continue
            have=$(apt-cache policy "$name" 2>/dev/null | sed -n 's/^ *Candidate: *//p' | head -1)
            [ "$have" = "$want" ] || echo "::error title=Pin unavailable: $name::$name is pinned to $want but this index offers ${have:-<none>}"
          done
          echo "--- install log tail ---"
          tail -30 /tmp/apt-install.log

      # Phase 2b asks for the host checks to be reported before infrastructure
      # work. Running them here means docs/phase2b-preflight.md can be checked
      # against a live run rather than trusted.
      - name: Preflight host and toolchain checks
        run: sh scripts/preflight.sh

      - name: Run CSRF Route and PolarIS Isolation Linters
        run: |
          python3 scripts/check_csrf_rules.py
          python3 scripts/check_polaris_access.py
          python3 scripts/check_admin_ui_coverage.py
          python3 scripts/check_dependency_pins.py

      - name: Configure CMake with Sanitizers
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_SANITIZERS=ON \
            -DBUILD_TESTING=ON

      - name: Build backend, worker, and test binaries
        run: |
          cmake --build build --parallel

      - name: Run Catch2 test suite with Sanitizers
        run: |
          ctest --test-dir build --output-on-failure

  integration-smoke:
    name: Phase 3 Integration Smoke (live stack)
    runs-on: ubuntu-24.04
    needs: cpp-build-and-test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # The legacy checkout is a documented, read-only reference for the
      # conversion, and `legacy/` is gitignored, so a CI workspace has none of
      # it. compose.yaml bind-mounts `../legacy/phpretro-pdo/web-gallery` into the
      # proxy; when the source does not exist Docker CREATES IT EMPTY, the mount
      # succeeds, and every legacy stylesheet and image 404s.
      #
      # That is not a cosmetic difference: the converted pages reuse the legacy
      # CSS verbatim, so they render as bare unstyled HTML and the visual-parity
      # suite fails on styling (measured 0.19-0.96 differing pixels) rather than
      # on any markup regression.
      #
      # WHERE the clone must land is not obvious and was got wrong once: compose
      # resolves `../legacy/...` against the Compose *project* directory, and on a
      # GitHub runner that is the PARENT of the checkout
      # (`/home/runner/work/hotel-drogon`), not the checkout itself
      # (`/home/runner/work/hotel-drogon/hotel-drogon`). The step below places the
      # assets at both candidate roots so the fix cannot depend on that detail,
      # and asserts the copy the proxy actually reads has the files.
      - name: Fetch the legacy web-gallery reference (sparse, read-only)
        run: |
          for root in "$GITHUB_WORKSPACE/.." "$GITHUB_WORKSPACE"; do
            dest="$root/legacy/phpretro-pdo"
            [ -d "$dest/web-gallery/v2/styles" ] && continue
            rm -rf "$dest"
            mkdir -p "$(dirname "$dest")"
            git clone --filter=blob:none --no-checkout --depth=1 \
              https://github.com/PapaBill1234/PHPRetro-PDO.git "$dest"
            git -C "$dest" sparse-checkout set --no-cone web-gallery housekeeping/images
            git -C "$dest" checkout
          done

      # Assert against the path the proxy ACTUALLY reads, not the path we hoped it
      # would. `docker inspect` is the authority here; checking the checkout path
      # alone is what let a previous attempt look correct while the mount was
      # still empty.
      - name: Verify the legacy assets the stack mounts are present
        run: |
          for root in "$GITHUB_WORKSPACE/.." "$GITHUB_WORKSPACE"; do
            echo "$root/legacy/phpretro-pdo/web-gallery: $(find "$root/legacy/phpretro-pdo/web-gallery" -type f 2>/dev/null | wc -l) files"
          done

      - name: Build and start the stack
        run: docker compose up -d --build

      - name: Wait for the stack to become healthy through the proxy
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/health || true)
            if [ "$code" = "200" ]; then
              echo "stack healthy after ${i} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::stack did not become healthy in time"
          docker compose logs --tail=200
          exit 1

      - name: Verify Compose delivered the React bundle and worker state
        run: |
          build_id=$(docker compose ps -aq frontend-build)
          [ -n "$build_id" ]
          [ "$(docker inspect "$build_id" --format '{{.State.ExitCode}}')" = "0" ]
          [ "$(docker inspect hotel_worker --format '{{.State.Status}}')" = "running" ]
          [ "$(docker inspect hotel_worker --format '{{if .State.Health}}present{{else}}absent{{end}}')" = "absent" ]
          curl --fail --silent --show-error http://localhost:3000/ -o /tmp/react-index.html
          grep -q 'id="root"' /tmp/react-index.html
          asset=$(grep -o '/assets/[^" ]*\.js' /tmp/react-index.html | head -1)
          [ -n "$asset" ]
          curl --fail --silent --show-error "http://localhost:3000$asset" -o /tmp/react-bundle.js
          [ -s /tmp/react-bundle.js ]

      - name: Verify the proxy is serving the legacy assets
        run: |
          # Guards the failure mode that broke parity twice: an empty web-gallery
          # mount still answers, so assert real bytes come back, and assert against
          # the mount Docker ACTUALLY resolved rather than the path we expected.
          # A checkout in the wrong place and a broken mount look identical from a
          # bare 404, which is exactly what made the first fix look correct.
          #
          # Deliberately plain shell: an earlier version of this step piped
          # `docker inspect` through an inline python one-liner and died on its own
          # quoting under `bash -e`, which is a self-inflicted way to lose a run.
          echo "== diagnostics =="
          echo "pwd: $(pwd)"
          echo "workspace: ${GITHUB_WORKSPACE:-unset}"
          echo "mounts:"
          docker inspect hotel_proxy --format '{{json .Mounts}}' | tr '{' '\n' | grep -o '"Source":"[^"]*","Destination":"[^"]*"'
          src=$(docker inspect hotel_proxy --format '{{json .Mounts}}' \
            | tr '{' '\n' \
            | grep '/var/www/web-gallery' \
            | sed -n 's/.*"Source":"\([^"]*\)".*/\1/p' \
            | head -1)
          echo "web-gallery mount source: ${src:-<none>}"
          echo "files at that source: $(find "${src:-/nonexistent}" -type f 2>/dev/null | wc -l)"
          echo "files inside the container: $(docker exec hotel_proxy sh -c 'find /var/www/web-gallery -type f | wc -l' || echo '?')"

          code=$(curl -s -o /tmp/style.css -w '%{http_code}' \
            http://localhost:3000/web-gallery/v2/styles/style.css)
          if [ "$code" != "200" ] || ! grep -qi 'font-family\|color' /tmp/style.css; then
            echo "::error::/web-gallery/v2/styles/style.css returned ${code} without CSS content; the legacy mount is empty and parity will fail on unstyled pages"
            docker compose logs --tail=100 proxy
            exit 1
          fi
          echo "legacy stylesheet served: $(wc -c < /tmp/style.css) bytes"

      - name: Run Phase 3 smoke suite
        run: sh scripts/smoke_phase3.sh http://localhost:3000

      - name: Validate the Phase 1 OpenAPI account contract against live routes
        env:
          ACCOUNT_CONTRACT_DISPOSABLE: '1'
        run: python3 scripts/check_account_contract.py http://localhost:3000

      - name: Seed rank-5 staff account (high-trust boundary test)
        run: |
          # sha1('password123' . 'staff5') — the legacy scheme is username-dependent
          docker exec hotel_mariadb mysql -uhotel -photel_secret polaris -e \
            "INSERT IGNORE INTO users (id, username, real_name, password, mail, rank, motto) \
             VALUES (3,'staff5','Rank Five Staff','d4f40b90b8bf7283b744efbc8b02cc5041f70e3d','staff5@hotel.local',5,'Rank 5');"

      - name: Run Phase 4 admin CMS smoke suite
        run: sh scripts/smoke_phase4_admin.sh http://localhost:3000

      - name: Run Phase 4 public API and RSS smoke suite
        run: python3 scripts/smoke_phase4_public.py http://localhost:3000

      # --- visual-parity data preconditions ---------------------------------
      #
      # The baselines were captured from a legacy stack that imports
      # tools/legacy-stack/init/99-seed.sql at database init. The new app has no
      # equivalent hook, so without this the parity run compares a seeded legacy
      # screenshot against an EMPTY new app and fails on content, not markup.
      # `docker exec -i` (no -t: -t rewrites line endings under Git Bash, which
      # is not this shell but is a trap worth not reintroducing).
      - name: Apply the shared content fixtures to the new app database
        run: docker exec -i hotel_mariadb mysql -uhotel -photel_secret polaris < tools/legacy-stack/init/99-seed.sql

      # The admin smoke suite above creates banners and does not delete them,
      # while the baselines have none, so the new app would render ad slots
      # legacy has no rows for. (Its own banners are deleted afterwards by the
      # Playwright flow, which asserts the deletion.)
      - name: Clear banners before the parity run
        run: |
          docker exec hotel_mariadb mysql -uhotel -photel_secret polaris \
            -e "DELETE FROM phpretro_banners;"

      # The maintenance baseline can only be captured with the site closed:
      # legacy maintenance.php redirects to "/" while site_closed is "0", so the
      # committed baseline is the maintenance page and the comparison needs the
      # same state. The seed above restores site_closed to "0", hence this.
      - name: Close the site for the maintenance baseline
        run: |
          docker exec hotel_mariadb mysql -uhotel -photel_secret polaris \
            -e "UPDATE phpretro_site_settings SET setting_value='1' WHERE setting_key='site_closed';"
          curl -s http://localhost:3000/api/public/maintenance

      - name: Set up Node for browser tests
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            tests/e2e/package-lock.json

      # The admin UI suite runs on the runner's own Chromium, so that one still
      # needs an explicit browser install. The parity suite does not: it runs in
      # the pinned container, which brings its own matching Chromium.
      - name: Install the Playwright browser for the admin UI suite
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Admin UI browser flow (Phase 4 exit condition)
        working-directory: tests/e2e
        env:
          PLAYWRIGHT_ADMIN: '1'
          BASE_NEW: http://localhost:3000
        run: npx playwright test admin.spec.ts

      # The Phase 5 existing-user journey through React. It runs here, before the
      # parity comparison, for two reasons: it needs the same live stack, and it
      # leaves `testuser` restored (the password restore is in a `finally`) with
      # only `mail_verified` reset — which no baseline page renders, so the
      # comparison below is unaffected. `PLAYWRIGHT_ACCOUNT` gates it exactly as
      # `PLAYWRIGHT_ADMIN` gates the suite above, so a bare `npx playwright test`
      # keeps its visual-parity meaning.
      - name: Account journey browser flow (Phase 5 existing-user slice)
        working-directory: tests/e2e
        env:
          PLAYWRIGHT_ACCOUNT: '1'
          BASE_NEW: http://localhost:3000
        run: npx playwright test account.spec.ts

      # The Phase 5 credits surface: the converted credits.php purse and the
      # converted history.php ledger. This suite seeds and removes its own two
      # ledger rows through `docker exec` — the ledger deliberately has no write
      # route, so there is no API to seed through — which is why it needs the
      # stack's container name and therefore runs here rather than in the parity
      # container. It cleans up after itself, so the parity comparison below sees
      # the same empty ledger it saw before this step existed.
      - name: Credits and ledger browser flow (Phase 5 credits slice)
        working-directory: tests/e2e
        env:
          PLAYWRIGHT_CREDITS: '1'
          BASE_NEW: http://localhost:3000
        run: npx playwright test credits.spec.ts

      # The Phase 5 client-entry handoff, the converted client.php. This asserts
      # only what the website can be held to — authorization, the ticket's legacy
      # format and storage, and the settings being reported honestly. It does NOT
      # assert that an emulator accepts the ticket: the browser-native client is a
      # separate milestone and no PolarIS/Nitro source is available to CI.
      - name: Client-entry handoff browser flow (Phase 5 client slice)
        working-directory: tests/e2e
        env:
          PLAYWRIGHT_CLIENT: '1'
          BASE_NEW: http://localhost:3000
        run: npx playwright test client.spec.ts

      # The comparison runs in the PINNED Playwright container, not on the
      # runner's own Chromium. The image pins the Chromium build *and* the font
      # set, which is what makes the comparison environment genuinely the same as
      # the one the baselines were captured in; a runner's Chromium plus distro
      # fonts is a different rendering environment even on the same distro.
      # `run-in-container.sh` uses `npm ci`, so the committed lockfile pins the
      # Playwright package version too.
      - name: Public page visual parity against the committed baselines
        env:
          BASE_NEW: http://localhost:3000
        run: |
          mkdir -p tests/e2e/.out
          docker run --rm -i \
            --network host \
            -v "$PWD:/repo:ro" \
            -v "$PWD/tests/e2e/.out:/out" \
            -e BASE_NEW=http://localhost:3000 \
            -e PLAYWRIGHT_ARGS=visual-parity.spec.ts \
            -e PLAYWRIGHT_REPORTER=list,json \
            mcr.microsoft.com/playwright:v1.63.0-noble \
            bash /repo/tests/e2e/run-in-container.sh

      # `if: always()` so a red parity run still hands back the actual, expected
      # and diff images. Without them a failure is only "exit code 1", which cost
      # two earlier runs of this workflow to a wrong diagnosis.
      - name: Upload visual-parity artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            tests/e2e/.out/test-results
            tests/e2e/.out/playwright-report
          if-no-files-found: ignore
          retention-days: 14

      - name: Dump service logs on failure
        if: failure()
        run: docker compose logs --tail=200

  # Phase 2b's "route-switch/proxy map with cutover AND rollback" exit condition.
  #
  # Separate job on purpose: it needs the legacy PHP stack running alongside the
  # new one, which the production compose.yaml deliberately does not provide, and
  # a failure here must not hide the smoke results (or vice versa).
  cutover-check:
    name: Route Cutover and Rollback (isolated stack)
    runs-on: ubuntu-24.04
    needs: cpp-build-and-test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # This job RUNS the legacy application, so it needs the whole checkout, not
      # just the static asset subtrees the smoke job mounts. A sparse checkout of
      # `web-gallery` alone left the PHP entry points and `includes/` absent, and
      # the cutover probe got Apache's 404 page instead of the feed — the CSS-only
      # subset is fine for the proxy's alias, but useless to Apache.
      #
      # Blobless and depth-1, so it is a small download; `legacy/` is gitignored in
      # this repository and is never committed.
      - name: Fetch the legacy application (blobless, read-only)
        run: |
          for root in "$GITHUB_WORKSPACE/.." "$GITHUB_WORKSPACE"; do
            dest="$root/legacy/phpretro-pdo"
            [ -f "$dest/xml/rss.php" ] && continue
            rm -rf "$dest"
            mkdir -p "$(dirname "$dest")"
            git clone --filter=blob:none --depth=1 \
              https://github.com/PapaBill1234/PHPRetro-PDO.git "$dest"
          done
          echo "legacy entry point present: $(test -f "$GITHUB_WORKSPACE/legacy/phpretro-pdo/xml/rss.php" && echo yes || echo no)"

      - name: Build the cutover harness (new stack + legacy stack + proxy)
        run: docker compose -p ci-cutover -f tools/ci-repro/compose-cutover.yaml up -d --build

      - name: Wait for the harness proxy
        run: |
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3500/health || true)
            [ "$code" = "200" ] && { echo "harness healthy after ${i} attempt(s)"; exit 0; }
            sleep 2
          done
          echo "::error::cutover harness did not become healthy"
          docker compose -p ci-cutover -f tools/ci-repro/compose-cutover.yaml logs --tail=200
          exit 1

      # Both sides get the same fixtures, so the two RSS implementations differ in
      # which one answered rather than one serving an empty feed. Deliberately a
      # SUBSET of the shared seed: the harness's legacy database creates only the
      # two tables this endpoint reads (see tools/ci-repro/cutover-legacy-min.sql),
      # and the full CleanDB import made that container fail to start on a runner.
      - name: Seed both harness databases
        run: |
          docker exec -i ci-cutover-mariadb-1 mysql -uhotel -photel_secret polaris < tools/ci-repro/cutover-fixtures.sql
          docker exec -i ci-cutover-legacy-db-1 mysql -uhotel -photel_secret polaris < tools/ci-repro/cutover-fixtures.sql

      - name: Verify cutover and rollback for /articles/rss.xml
        env:
          COMPOSE_ARGS: -p ci-cutover -f tools/ci-repro/compose-cutover.yaml
        run: sh scripts/check_cutover.sh http://localhost:3500

      - name: Tear the harness down
        if: always()
        run: docker compose -p ci-cutover -f tools/ci-repro/compose-cutover.yaml down -v
