name: CI Build & Verify

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  cpp-build-and-test:
    name: C++ Drogon (Sanitizers + Tests)
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            libssl-dev \
            zlib1g-dev \
            libbrotli-dev \
            libc-ares-dev \
            libyaml-cpp-dev \
            libjsoncpp-dev \
            uuid-dev \
            libmariadb-dev \
            libpq-dev \
            libsqlite3-dev \
            libhiredis-dev \
            libspdlog-dev \
            libcrypt-dev \
            catch2 \
            libdrogon-dev \
            nlohmann-json3-dev \
            python3

      - name: Run CSRF Route and PolarIS Isolation Linters
        run: |
          python3 scripts/check_csrf_rules.py
          python3 scripts/check_polaris_access.py
          python3 scripts/check_admin_ui_coverage.py

      - name: Configure CMake with Sanitizers
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_SANITIZERS=ON \
            -DBUILD_TESTING=ON

      - name: Build backend, worker, and test binaries
        run: |
          cmake --build build --parallel

      - name: Run Catch2 test suite with Sanitizers
        run: |
          ctest --test-dir build --output-on-failure

  integration-smoke:
    name: Phase 3 Integration Smoke (live stack)
    runs-on: ubuntu-24.04
    needs: cpp-build-and-test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and start the stack
        run: docker compose up -d --build

      - name: Wait for the stack to become healthy through the proxy
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/health || true)
            if [ "$code" = "200" ]; then
              echo "stack healthy after ${i} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::stack did not become healthy in time"
          docker compose logs --tail=200
          exit 1

      - name: Run Phase 3 smoke suite
        run: sh scripts/smoke_phase3.sh http://localhost:3000

      - name: Seed rank-5 staff account (high-trust boundary test)
        run: |
          # sha1('password123' . 'staff5') — the legacy scheme is username-dependent
          docker exec hotel_mariadb mysql -uhotel -photel_secret polaris -e \
            "INSERT IGNORE INTO users (id, username, real_name, password, mail, rank, motto) \
             VALUES (3,'staff5','Rank Five Staff','d4f40b90b8bf7283b744efbc8b02cc5041f70e3d','staff5@hotel.local',5,'Rank 5');"

      - name: Run Phase 4 admin CMS smoke suite
        run: sh scripts/smoke_phase4_admin.sh http://localhost:3000

      - name: Run Phase 4 public API and RSS smoke suite
        run: python3 scripts/smoke_phase4_public.py http://localhost:3000

      # --- visual-parity data preconditions ---------------------------------
      #
      # The baselines were captured from a legacy stack that imports
      # tools/legacy-stack/init/99-seed.sql at database init. The new app has no
      # equivalent hook, so without this the parity run compares a seeded legacy
      # screenshot against an EMPTY new app and fails on content, not markup.
      # `docker exec -i` (no -t: -t rewrites line endings under Git Bash, which
      # is not this shell but is a trap worth not reintroducing).
      - name: Apply the shared content fixtures to the new app database
        run: docker exec -i hotel_mariadb mysql -uhotel -photel_secret polaris < tools/legacy-stack/init/99-seed.sql

      # The admin smoke suite above creates banners and does not delete them,
      # while the baselines have none, so the new app would render ad slots
      # legacy has no rows for. (Its own banners are deleted afterwards by the
      # Playwright flow, which asserts the deletion.)
      - name: Clear banners before the parity run
        run: |
          docker exec hotel_mariadb mysql -uhotel -photel_secret polaris \
            -e "DELETE FROM phpretro_banners;"

      # The maintenance baseline can only be captured with the site closed:
      # legacy maintenance.php redirects to "/" while site_closed is "0", so the
      # committed baseline is the maintenance page and the comparison needs the
      # same state. The seed above restores site_closed to "0", hence this.
      - name: Close the site for the maintenance baseline
        run: |
          docker exec hotel_mariadb mysql -uhotel -photel_secret polaris \
            -e "UPDATE phpretro_site_settings SET setting_value='1' WHERE setting_key='site_closed';"
          curl -s http://localhost:3000/api/public/maintenance

      - name: Set up Node for the frontend build and browser tests
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            tests/e2e/package-lock.json

      - name: Build the React frontend (TypeScript + Vite)
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # The bundle was already built into the host bind-mount above, which is
      # what nginx serves. Nginx resolves its static root once at start, so a
      # reload (not a restart) is enough to pick up replaced files, and a reload
      # keeps the container address stable — the variable-based proxy_pass
      # re-resolves at most every 10s, and `docker compose restart` would
      # otherwise leave a window of 502s right before the browser tests run.
      - name: Reload the proxy so it serves the freshly built bundle
        run: docker compose exec -T proxy nginx -s reload

      - name: Wait for the stack again after the proxy reload
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/health || true)
            if [ "$code" = "200" ]; then
              echo "stack healthy after ${i} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::stack did not become healthy after the proxy reload"
          docker compose logs --tail=200
          exit 1

      - name: Install the Playwright browser
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Admin UI browser flow (Phase 4 exit condition)
        working-directory: tests/e2e
        env:
          PLAYWRIGHT_ADMIN: '1'
          BASE_NEW: http://localhost:3000
        run: npx playwright test admin.spec.ts

      - name: Public page visual parity against the committed baselines
        working-directory: tests/e2e
        env:
          BASE_NEW: http://localhost:3000
        run: |
          # Failure diagnosis has to travel in the LOG. Artifacts are uploaded
          # but are not always reachable (they were not, the first time this step
          # failed), which left "exit code 1" as the only evidence. The JSON
          # reporter writes to stdout and carries each comparison's failure text,
          # so a mismatch names the page and the magnitude instead of only failing.
          npx playwright test visual-parity.spec.ts --reporter=list,json

      - name: Upload Playwright artefacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: tests/e2e/test-results
          if-no-files-found: ignore

      - name: Dump service logs on failure
        if: failure()
        run: docker compose logs --tail=200

