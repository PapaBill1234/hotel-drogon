services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hotel_backend
    restart: unless-stopped
    environment:
      APP_ENV: development
      APP_PORT: 8080
      LOG_LEVEL: debug
      LOG_JSON: "false"
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_DATABASE: polaris
      DB_USERNAME: hotel
      DB_PASSWORD: hotel_secret
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      # The website owns the lifetime of the SSO tickets it issues, because
      # Polaris matches `users.auth_ticket` at game login without consulting an
      # expiry. Overridden in CI so the void can be observed inside a test run;
      # see scripts/check_sso_replay_bound.sh.
      SSO_TICKET_TTL_SECONDS: ${SSO_TICKET_TTL_SECONDS:-120}
      SSO_TICKET_SWEEP_SECONDS: ${SSO_TICKET_SWEEP_SECONDS:-5}
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      hotel-network:
        # `app` is the name the cutover map uses for the new stack
        # (proxy/cutover.map). Aliasing it here keeps the map independent of the
        # Compose service key, so a rename cannot silently invalidate it.
        aliases:
          - app

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["/app/hotel_worker"]
    # The worker has no HTTP listener. The backend image's /health probe would
    # always report it unhealthy, so do not claim a health signal we cannot test.
    healthcheck:
      disable: true
    container_name: hotel_worker
    restart: unless-stopped
    environment:
      APP_ENV: development
      LOG_LEVEL: debug
      LOG_JSON: "false"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - hotel-network

  mariadb:
    image: mariadb:10.11
    container_name: hotel_mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: polaris
      MYSQL_USER: hotel
      MYSQL_PASSWORD: hotel_secret
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - hotel-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: hotel_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - hotel-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  frontend-build:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: "no"
    volumes:
      - frontend_dist:/out

  proxy:
    image: nginx:alpine
    container_name: hotel_proxy
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      # The rest of the proxy configuration — the cutover map — as a DIRECTORY, not
      # as a single file, and deliberately so.
      #
      # Mounting `proxy/cutover.map` as one file pins the container to that file's
      # INODE. An edit that replaces the file — `sed -i`, `mv`, an editor's atomic
      # save — leaves the mount attached to the old inode, so the host shows the
      # new map and nginx keeps reading the old one. That is not theoretical: it is
      # why the cutover check passed on a Windows host (whose bind mounts resolve
      # by path) and failed on Linux CI, where the map appeared to change and
      # routing did not.
      #
      # With the directory mounted, both atomic replacement and in-place writes are
      # visible, so the documented edit-then-reload procedure works however the
      # file is edited. Read-only: changes belong in the repo and in Git, not in
      # the container.
      - ./proxy:/etc/nginx/config:ro
      # Legacy web-gallery assets: the stylesheets and imagery the converted
      # pages must reuse verbatim (nginx aliases /web-gallery/ to this path).
      # Without it the React pages render completely unstyled.
      - ../legacy/phpretro-pdo/web-gallery:/var/www/web-gallery:ro
      # Legacy housekeeping panel assets, aliased to /housekeeping/images/ by
      # nginx. The converted admin panel keeps the legacy URL shape, so its
      # stylesheets and icons have to come from the same read-only checkout.
      - ../legacy/phpretro-pdo/housekeeping/images:/var/www/housekeeping-images:ro
      # Compose builds the React bundle and publishes it to this generated-assets
      # volume before nginx starts. No host Node build or writable source mount.
      - frontend_dist:/usr/share/nginx/html:ro
    depends_on:
      backend:
        condition: service_started
      frontend-build:
        condition: service_completed_successfully
    networks:
      - hotel-network

networks:
  hotel-network:
    driver: bridge

volumes:
  mariadb_data:
  redis_data:
  frontend_dist:
